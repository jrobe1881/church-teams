<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark near-black background -->
  <rect width="512" height="512" rx="96" fill="#141010"/>
  <!-- 4 diamond compass layout scaled to 512x512 -->
  <!-- Each half-size=64, gap=24 from center (256,256) -->
  <!-- Top: center (256, 144) -->
  <polygon points="256,80 320,144 256,208 192,144" fill="#b06070"/>
  <!-- Right: center (368, 256) -->
  <polygon points="368,192 432,256 368,320 304,256" fill="#b06070"/>
  <!-- Bottom: center (256, 368) -->
  <polygon points="256,304 320,368 256,432 192,368" fill="#b06070"/>
  <!-- Left: center (144, 256) -->
  <polygon points="144,192 208,256 144,320 80,256" fill="#b06070"/>
</svg>
