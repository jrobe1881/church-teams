<script>/*fouc*/(function(){try{
var h=document.documentElement,
ts=localStorage.getItem("bsh_theme_v1")||"auto",
ac=localStorage.getItem("bsh_accent_v1")||"",
r=ts==="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):ts;
h.style.colorScheme=r;
h.style.background=r==="dark"?"#050505":"#fafafa";
h.setAttribute("data-theme-early",r);
h.classList.add("theme-"+r+"-early");
if(/^#[0-9a-fA-F]{6}$/.test(ac)){
h.setAttribute("data-accent",ac);
var p=parseInt(ac.slice(1),16),rv=(p>>16)&255,gv=(p>>8)&255,bv=p&255;
function cl(x){return Math.max(0,Math.min(255,Math.round(x)));}
function rgb(r,g,b){return"rgb("+r+","+g+","+b+")";}
var dk=r==="dark";
var fa=dk?rgb(cl(rv+40),cl(gv+40),cl(bv+40)):ac;
var fh=dk?rgb(cl(rv+60),cl(gv+60),cl(bv+60)):rgb(cl(rv-18),cl(gv-18),cl(bv-18));
var ta=dk?0.12:0.08;
var ft="rgba("+rv+","+gv+","+bv+","+ta+")";
var fs=dk?"rgba("+rv+","+gv+","+bv+",.15)":rgb(cl(rv+110),cl(gv+110),cl(bv+110));
var ff="0 0 0 3px rgba("+rv+","+gv+","+bv+","+(dk?0.30:0.15)+")";
var s=document.createElement("style");
s.id="bsh-accent-fouc";
s.textContent="html[data-accent]{--accent:"+fa+";--accent-hover:"+fh+";--accent-tint:"+ft+";--accent-soft:"+fs+";--focus:"+ff+"}"
+"html[data-accent][data-theme-early=dark],html[data-accent][data-theme-early=dark] body{--accent:"+fa+";--accent-hover:"+fh+";--accent-tint:"+ft+";--accent-soft:"+fs+";--focus:"+ff+"}";
document.head.appendChild(s);
}
}catch(e){}})();</script>

<style>
  html,body{margin:0;padding:0;background:var(--n50);color:var(--ink);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .rp-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--shadow-2);
    max-width:420px;width:100%;padding:32px 28px 28px;
  }
  .rp-title{font-family:var(--font-serif);font-size:var(--t-2xl);margin:0 0 4px;color:var(--ink)}
  .rp-sub{color:var(--ink-3);font-size:var(--t-sm);margin:0 0 20px;line-height:1.5}
  .rp-field{margin-bottom:14px}
  .rp-label{display:block;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px;font-weight:600}
  .rp-input{
    width:100%;padding:11px 14px;font-size:var(--t-md);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--ink);font-family:inherit;box-sizing:border-box;
    transition:border-color var(--dur-1);
  }
  .rp-input:focus{outline:none;border-color:var(--accent)}
  .rp-btn{
    width:100%;padding:12px;min-height:44px;font-size:var(--t-sm);font-weight:600;font-family:inherit;
    background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);cursor:pointer;
    transition:background var(--dur-1);
  }
  .rp-btn:hover{background:var(--accent-hover)}
  .rp-btn:disabled{opacity:.6;cursor:not-allowed}
  .rp-msg{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:var(--t-sm);display:none;line-height:1.4}
  .rp-msg.err{display:block;background:rgba(224,85,85,.12);color:#a53535}
  .rp-msg.ok{display:block;background:rgba(76,175,80,.14);color:#2f7a3a}
  .rp-msg.warn{display:block;background:rgba(245,158,11,.12);color:#8a5a00}
  .rp-link{display:block;margin-top:16px;text-align:center;color:var(--ink-3);font-size:var(--t-xs);text-decoration:none}
  .rp-link:hover{color:var(--accent)}
  #rpForm.hide{display:none}
.acct-fab{display:none!important}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "ChurchTeams",
  "url": "https://bibleparlor.com/teams/",
  "logo": "https://bibleparlor.com/apple-touch-icon-ct.png",
  "description": "ChurchTeams is a private church dashboard for tracking Bible studies, follow-ups, cultivation, and baptisms.",
  "sameAs": []
}
</script>

<body>

<main>
  <div class="rp-card">
    <h1 class="rp-title" id="rpTitle" data-i18n="resetpw.title">Choose a new password</h1>
    <p class="rp-sub" id="rpSub" data-i18n="resetpw.verifying">Verifying your reset link…</p>
    <form id="rpForm" class="hide">
      <div class="rp-field">
        <label class="rp-label" for="rpPwd" data-i18n="resetpw.label.new">New password</label>
        <input class="rp-input" id="rpPwd" type="password" autocomplete="new-password" required minlength="6" data-i18n-ph="resetpw.label.new" />
      </div>
      <div class="rp-field">
        <label class="rp-label" for="rpPwd2" data-i18n="resetpw.label.confirm">Confirm password</label>
        <input class="rp-input" id="rpPwd2" type="password" autocomplete="new-password" required minlength="6" data-i18n-ph="resetpw.label.confirm" />
      </div>
      <button class="rp-btn" id="rpSubmit" type="submit" data-i18n="resetpw.btn.submit">Update password</button>
    </form>
    <div class="rp-msg" id="rpMsg"></div>
    <a class="rp-link" href="/dashboard/" data-i18n="resetpw.back">Back to ChurchTeams</a>
  </div>
</main>

<script src="/shared/safe-storage.js?v=2"></script>
<script src="/shared/theme.js?v=17"></script>
<script src="/shared/i18n.js?v=1"></script>
<script src="/shared/account.js?v=25"></script>
<script>
(function(){
  function t(key, fallback){ return (window.BpI18n && window.BpI18n.t) ? window.BpI18n.t(key, fallback) : (fallback || key); }

  var $form = document.getElementById('rpForm');
  var $p1 = document.getElementById('rpPwd');
  var $p2 = document.getElementById('rpPwd2');
  var $btn = document.getElementById('rpSubmit');
  var $msg = document.getElementById('rpMsg');
  var $sub = document.getElementById('rpSub');
  var $title = document.getElementById('rpTitle');

  var settled = false;
  function showMsg(text, kind){
    $msg.textContent = text;
    $msg.className = 'rp-msg ' + (kind || 'err');
  }
  function showForm(){
    if (settled) return;
    settled = true;
    $form.classList.remove('hide');
    $sub.textContent = t('resetpw.form.sub', 'Enter a new password for your account. You\u2019ll be signed in automatically.');
    setTimeout(function(){ try{ $p1.focus(); }catch(e){} }, 50);
  }
  function showBlocked(reason){
    if (settled) return;
    settled = true;
    $form.classList.add('hide');
    $title.textContent = t('resetpw.blocked.title', 'Reset link problem');
    $sub.textContent = reason;
  }

  // Peek at the URL up-front so a reload with a stripped hash gives a clear message.
  var initialHash = location.hash || '';
  var initialSearch = location.search || '';
  var errorDesc = new URLSearchParams(initialHash.replace(/^#/, '')).get('error_description')
              || new URLSearchParams(initialSearch).get('error_description');
  if (errorDesc){
    showBlocked(errorDesc + t('resetpw.err.suffix', ' Please request a new reset link from the sign-in screen.'));
    return;
  }

  CloudAccount.ready.then(function(){
    var sb = CloudAccount.getSupabaseClient();
    if (!sb){ showBlocked(t('resetpw.err.noAuth', 'Auth is not available. Please refresh the page.')); return; }

    // 1) Handle PKCE-style ?code=... links (newer Supabase templates).
    var code = new URLSearchParams(location.search).get('code');
    if (code && sb.auth.exchangeCodeForSession){
      sb.auth.exchangeCodeForSession(code).then(function(res){
        if (res && res.error){
          showBlocked(res.error.message + t('resetpw.err.suffix', ' Please request a new reset link from the sign-in screen.'));
        } else {
          showForm();
        }
      }).catch(function(err){
        showBlocked('Could not verify link: ' + (err && err.message || err));
      });
      return;
    }

    // 2) Listen for the recovery event fired when the SDK parses the URL hash.
    sb.auth.onAuthStateChange(function(event, session){
      if (settled) return;
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)){
        showForm();
      }
    });

    // 3) In case the SDK already parsed the hash before we subscribed
    //    (or we arrived while already signed in), poll getSession() briefly.
    var deadline = Date.now() + 8000;
    (function poll(){
      if (settled) return;
      sb.auth.getSession().then(function(res){
        if (settled) return;
        var sess = res && res.data && res.data.session;
        if (sess){
          showForm();
          return;
        }
        if (Date.now() > deadline){
          if (!initialHash && !initialSearch){
            showBlocked(t('resetpw.err.noHash', 'This page can only be opened from the reset link in your email. Request a new reset link from the sign-in screen.'));
          } else {
            showBlocked(t('resetpw.err.expired', 'The reset link is invalid or has already been used. Please request a new one from the sign-in screen.'));
          }
          return;
        }
        setTimeout(poll, 250);
      });
    })();
  });

  $form.addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = $p1.value, p2 = $p2.value;
    if (p1.length < 6){ showMsg(t('resetpw.err.short', 'Password must be at least 6 characters.')); return; }
    if (p1 !== p2){ showMsg(t('resetpw.err.mismatch', 'Passwords do not match.')); return; }
    var sb = CloudAccount.getSupabaseClient();
    if (!sb){ showMsg(t('resetpw.err.notReady', 'Auth not ready \u2014 please refresh.')); return; }
    $btn.disabled = true;
    $btn.textContent = t('resetpw.btn.updating', 'Updating\u2026');
    sb.auth.updateUser({ password: p1 }).then(function(res){
      if (res && res.error) throw res.error;
      showMsg(t('resetpw.ok', 'Password updated. Redirecting\u2026'), 'ok');
      setTimeout(function(){ location.href = '/read/'; }, 1200);
    }).catch(function(err){
      $btn.disabled = false;
      $btn.textContent = t('resetpw.btn.submit', 'Update password');
      showMsg(String(err && err.message || err));
    });
  });
})();
</script>
</body>
</html>
