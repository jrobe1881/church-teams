<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background rounded square (ChurchTeams burgundy) -->
  <rect width="32" height="32" rx="7" fill="#7a1f2b"/>
  <!-- ❖ diamond glyph: outer diamond + inner diamond (hollow) + four corner dots -->
  <!-- Outer diamond -->
  <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <!-- Inner diamond -->
  <polygon points="16,10 22,16 16,22 10,16" fill="#ffffff"/>
  <!-- Corner dots -->
  <circle cx="16" cy="3"  r="1.8" fill="#ffffff"/>
  <circle cx="29" cy="16" r="1.8" fill="#ffffff"/>
  <circle cx="16" cy="29" r="1.8" fill="#ffffff"/>
  <circle cx="3"  cy="16" r="1.8" fill="#ffffff"/>
</svg>
