<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark near-black background -->
  <rect width="32" height="32" rx="6" fill="#141010"/>
  <!-- 4 diamond cluster: 2x2 grid, each diamond half-size=4.5, 1px gap, centered on 16,16 -->
  <!-- Top-left: center (11.5, 11.5) -->
  <polygon points="11.5,7 16,11.5 11.5,16 7,11.5" fill="#b06070"/>
  <!-- Top-right: center (20.5, 11.5) -->
  <polygon points="20.5,7 25,11.5 20.5,16 16,11.5" fill="#b06070"/>
  <!-- Bottom-left: center (11.5, 20.5) -->
  <polygon points="11.5,16 16,20.5 11.5,25 7,20.5" fill="#b06070"/>
  <!-- Bottom-right: center (20.5, 20.5) -->
  <polygon points="20.5,16 25,20.5 20.5,25 16,20.5" fill="#b06070"/>
</svg>
